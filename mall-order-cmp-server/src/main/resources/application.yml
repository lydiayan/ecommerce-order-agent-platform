
spring:
  application:
    name: mall-order-cmp-server
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        enabled: true
        name: mall-order-cmp-server
        version: 1.0.0
        type: ASYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        cors:
          allowed-origins: "http://127.0.0.1:8087,http://localhost:8087"
          allowed-methods: "GET,POST,OPTIONS"
          allowed-headers: "Content-Type,Accept"
        security:
          enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
mall-order:
  base-url: ${MALL_ORDER_BASE_URL:http://127.0.0.1:8081}
  service-token: ${MALL_ORDER_SERVICE_TOKEN:local-order-service-token-change-me}
mcp:
  auth:
    token: ${MCP_SERVICE_TOKEN:local-mcp-service-token-change-me}
logging:
  level:
    io.modelcontextprotocol: INFO
    org.springframework.ai: INFO
    org.springframework.web: INFO

  pattern.console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
