<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 商城订单 Agent</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-panel">
    <div class="brand"><span class="brand-mark">OA</span><div><strong>商城订单 Agent</strong><span>身份与权限工作台</span></div></div>
    <h1>账户登录</h1>
    <p class="subtitle">使用已分配的业务账户进入工作区</p>
    <form id="loginForm">
      <div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="error" id="loginError" role="alert"></p>
      <button class="primary" id="loginButton" type="submit">登录</button>
    </form>
  </section>
  <section class="demo-panel">
    <h2>演示账户</h2>
    <p>选择身份填入用户名，权限由登录会话决定</p>
    <div class="accounts" id="demoAccounts"></div>
  </section>
</main>
<script src="/login.js?v=20260824b" defer></script>
</body>
</html>
