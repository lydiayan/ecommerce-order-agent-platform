<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>商城订单 Agent</title>
  <link rel="stylesheet" href="/style.css?v=20260819a"/>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="logo" aria-hidden="true">OA</span>
    <div>
      <h1>商城订单 Agent</h1>
      <p>身份与权限工作台</p>
    </div>
  </div>
  <div class="header-actions">
    <div class="status" id="statusBadge" title="Agent 服务状态">
      <span class="status-dot"></span>
      <span id="statusText">连接中</span>
    </div>
    <div class="persona-trigger account-chip">
      <span class="avatar" id="currentAvatar">张</span>
      <span class="persona-trigger-copy">
        <strong id="currentPersonaName">张伟</strong>
        <small id="currentPersonaMeta">客户 · USER1001</small>
      </span>
    </div>
    <button type="button" class="button button-quiet" id="logoutBtn">退出</button>
  </div>
</header>

<main class="app-layout">
  <section class="chat-surface" aria-labelledby="chatTitle">
    <div class="surface-header chat-header">
      <div>
        <span class="eyebrow">当前会话</span>
        <h2 id="chatTitle">智能协作</h2>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <form class="composer" id="chatForm">
      <label class="sr-only" for="queryInput">输入问题</label>
      <input type="text" id="queryInput" placeholder="输入问题" autocomplete="off"/>
      <button type="submit" class="button button-primary" id="sendBtn">发送</button>
    </form>
  </section>

  <aside class="workspace" aria-labelledby="workspaceTitle">
    <div class="surface-header workspace-header">
      <div>
        <span class="eyebrow" id="workspaceEyebrow">客户工作区</span>
        <h2 id="workspaceTitle">我的订单</h2>
      </div>
      <button type="button" class="icon-button" id="refreshWorkspace" title="刷新工作区" aria-label="刷新工作区">↻</button>
    </div>
    <div class="persona-summary" id="personaSummary"></div>
    <div class="workspace-content" id="workspaceContent">
      <p class="empty-state">加载中</p>
    </div>
  </aside>
</main>

<script src="/app.js?v=20260819a"></script>
</body>
</html>
