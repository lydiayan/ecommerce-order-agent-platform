<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码 · 商城订单 Agent</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="change-card">
  <div class="brand"><span class="brand-mark">OA</span><div><strong>商城订单 Agent</strong><span>账户安全</span></div></div>
  <h1>修改密码</h1>
  <p class="subtitle">初始或临时密码必须更换后才能继续</p>
  <form id="passwordForm">
    <div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div>
    <div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></div>
    <p class="error" id="passwordError" role="alert"></p>
    <button class="primary" id="passwordButton" type="submit">保存并重新登录</button>
  </form>
</main>
<script src="/change-password.js" defer></script>
</body>
</html>
