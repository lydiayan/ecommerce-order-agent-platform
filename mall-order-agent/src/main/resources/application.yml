server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8087}
  forward-headers-strategy: framework

spring:
  application:
    name: mall-order-agent

  servlet:
    multipart:
      max-file-size: ${RAG_PDF_MAX_FILE_SIZE:20MB}
      max-request-size: ${RAG_PDF_MAX_REQUEST_SIZE:22MB}

  config:
    import: classpath:rag.yml

  datasource:
    url: ${AGENT_MEMORY_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/agent_memory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:portfolio}
    password: ${MYSQL_PASSWORD:portfolio}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: ${AGENT_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}

  session:
    store-type: redis
    timeout: ${AGENT_SESSION_IDLE_TIMEOUT:30m}
    redis:
      namespace: mall-order-agent:session
      repository-type: indexed

  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:missing}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      embedding:
        options:
          model: text-embedding-v2
      chat:
        options:
          model: ${AGENT_MODEL_NAME:qwen-plus}
          temperature: 0.3
    mcp:
      client:
        enabled: true
        name: mall-order-agent-mcp
        version: 1.0.0
        request-timeout: 30s
        type: ASYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            order-server:
              url: ${MCP_SERVER_URL:http://127.0.0.1:8082}

observability:
  enabled: true
  service-name: mall-order-agent
  producer:
    enabled: true
  consumer:
    enabled: false
  trace:
    topic: rag-trace-events
    tag: trace

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:127.0.0.1:19876}
  producer:
    group: rag-trace-producer-agent
    send-message-timeout: 3000

agent:
  auth:
    enabled: ${AGENT_AUTH_ENABLED:true}
    demo-initial-password: ${DEMO_INITIAL_PASSWORD:DemoLogin@2026!}
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
    evaluation-token: ${AGENT_EVALUATION_TOKEN:local-evaluation-token-change-me}
    absolute-session-seconds: ${AGENT_SESSION_ABSOLUTE_SECONDS:28800}
    login-max-failures: ${AGENT_LOGIN_MAX_FAILURES:5}
    login-lock-seconds: ${AGENT_LOGIN_LOCK_SECONDS:900}
    trusted-proxies: ${AGENT_TRUSTED_PROXIES:127.0.0.1,::1}
    secure-cookie: ${AGENT_SECURE_COOKIE:false}
    service-token: ${MALL_ORDER_SERVICE_TOKEN:local-order-service-token-change-me}
    mcp-service-token: ${MCP_SERVICE_TOKEN:local-mcp-service-token-change-me}
  conversation:
    max-turns: 10
  streaming:
    timeout-millis: ${AGENT_STREAM_TIMEOUT_MILLIS:180000}
    max-active-streams: ${AGENT_STREAM_MAX_ACTIVE:100}
    core-pool-size: ${AGENT_STREAM_CORE_POOL_SIZE:4}
    max-pool-size: ${AGENT_STREAM_MAX_POOL_SIZE:16}
    queue-capacity: ${AGENT_STREAM_QUEUE_CAPACITY:64}
  intent:
    llm-enabled: ${AGENT_INTENT_LLM_ENABLED:true}
    model: ${AGENT_INTENT_MODEL_NAME:qwen-turbo}
    confidence-threshold: ${AGENT_INTENT_CONFIDENCE_THRESHOLD:0.80}
    max-query-length: ${AGENT_INTENT_MAX_QUERY_LENGTH:2000}
  feedback:
    enabled: ${AGENT_FEEDBACK_ENABLED:true}
    retention-days: ${AGENT_FEEDBACK_RETENTION_DAYS:90}
    encryption-key: ${AGENT_FEEDBACK_ENCRYPTION_KEY:local-feedback-key-change-before-production}
    model-name: ${AGENT_MODEL_NAME:qwen-plus}
    agent-version: ${AGENT_VERSION:dev}
    sync:
      enabled: ${AGENT_FEEDBACK_SYNC_ENABLED:true}
      topic: ${AGENT_FEEDBACK_SYNC_TOPIC:agent-feedback-events}
      tag: ${AGENT_FEEDBACK_SYNC_TAG:feedback}
      poll-interval-ms: ${AGENT_FEEDBACK_SYNC_POLL_INTERVAL_MS:1000}
      batch-size: ${AGENT_FEEDBACK_SYNC_BATCH_SIZE:50}
      max-attempts: ${AGENT_FEEDBACK_SYNC_MAX_ATTEMPTS:8}
  evaluation:
    sync:
      topic: ${AGENT_EVALUATION_SYNC_TOPIC:agent-evaluation-events}
      tag: ${AGENT_EVALUATION_SYNC_TAG:evaluation}
  graph:
    human-review-enabled: true # 敏感操作人工审核（退货/付款/删除/确认类回复）
  order:
    base-url: ${MALL_ORDER_BASE_URL:http://127.0.0.1:8081}
    mcp:
      enabled: true

memory:
  enabled: true
  user-id: default_user
  conversation-id: default
  short-term:
    max-size: 20
    key-prefix: memory:short
    cursor-key-prefix: memory:consolidate:cursor
    ttl-seconds: 604800
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      connection-timeout-ms: 5000
  long-term:
    dimension: 1536
    milvus:
      host: ${MILVUS_HOST:127.0.0.1}
      port: ${MILVUS_PORT:29530}
  extractor:
    enabled: true
  consolidation:
    enabled: true
    interval-ms: 300000
    min-messages: 4
    message-threshold: 10
    token-threshold: 800
  user-profile:
    enabled: true
