
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: mall-order
  datasource:
    url: ${MALL_ORDER_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/products?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:portfolio}
    password: ${MYSQL_PASSWORD:portfolio}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.mallorder.entity

service:
  auth:
    token: ${MALL_ORDER_SERVICE_TOKEN:local-order-service-token-change-me}
