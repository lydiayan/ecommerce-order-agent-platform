spring:
  application:
    name: skill-agent-demo
  ai:
    alibaba:
      agent:
        studio:
          enabled: true
          skills:
            # 配置 skills 目录路径
            base-path: classpath:skills
            # 自动加载 skills，智能体可以自动发现和使用
            auto-load: true
      # DashScope 配置
      dashscope:
        api-key: ${DASHSCOPE_API_KEY:your-api-key}
      # 聊天模型配置
      chat:
        options:
          model: qwen-max

server:
  port: 8080

logging:
  level:
    com.jyy.skillagentdemo: DEBUG
    org.springframework.ai: DEBUG
    com.alibaba.cloud.ai.agent.studio: DEBUG
