<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单与聊天界面</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
        }

        .container {
            display: flex;
            height: 100vh;
        }
        .left-panel {
            width: 70%;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }
        .right-panel {
            width: 30%;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #f9f9f9;
        }
        .order-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .order-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .order-item:hover {
            background-color: #f0f0f0;
        }
        .order-item.active {
            background-color: #e6f7ff;
            border-right: 3px solid #1890ff;
        }
        .order-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* 在小屏幕上换行 */
        }
        .order-summary p {
            margin: 5px 15px 5px 0; /* 调整右边距以增加间距 */
            color: #333;

        }
        .order-details {
            margin-top: 15px;
            padding-left: 10px;
            border-left: 2px solid #1890ff;
            font-size: 0.9em;
            color: #555;
        }
        .order-details p {
            margin: 5px 0;
        }
        .status-icon {
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            font-size: 1.2em;
        }
        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #e0e0e0;
            background-color: #fff;
        }
        .chat-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 18px;
            outline: none;
        }
        .send-button {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .send-button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .my-message {
            background-color: #dcf8c6;
            align-self: flex-end;
        }
        .other-message {
            background-color: #fff;
            border: 1px solid #eee;
            align-self: flex-start;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <ul id="order-list" class="order-list">
            <!-- Orders will be loaded here -->
        </ul>
    </div>
    <div class="right-panel">
        <div id="chat-box" class="chat-box">
            <div class="message other-message">您好！请问有什么可以帮助您的吗？</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="输入消息...">
            <button id="send-button" class="send-button">发送</button>
        </div>
    </div>
</div>

<script>

    function loadOrders() {
        const orderList = document.getElementById('order-list');
        fetch('http://127.0.0.1:8081/orders/list')
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应失败: ' + response.statusText);
                }
                return response.json();
            })
            .then(orders => {
                orderList.innerHTML = ''; // 清空原有列表
                orders.forEach(order => {
                    const item = document.createElement('li');
                    item.className = 'order-item';
                    item.dataset.orderId = order.orderId;

                    const statusMap = {
                        0: { text: '待付款', icon: '⏳' },
                        1: { text: '已付款', icon: '💰' },
                        2: { text: '已发货', icon: '🚚' },
                        3: { text: '已完成', icon: '✅' },
                        4: { text: '已取消', icon: '❌' }
                    };

                    item.innerHTML = `
                        <div class="order-summary">
                            <p><strong>订单ID:</strong> ${order.orderId}</p>
                            <p><strong>用户ID:</strong> ${order.userId}</p>
                            <p><strong>价格:</strong> ¥${order.totalAmount.toFixed(2)}</p>
                            <p><strong>状态:</strong> <span class="status-icon">${statusMap[order.orderStatus]?.icon || ''} </span> ${statusMap[order.orderStatus]?.text || '未知'}</p>
                        </div>
                        <div class="order-details" style="display: none;">
                            <p><strong>下单时间:</strong> ${new Date(order.orderTime).toLocaleString()}</p>
                            <p><strong>支付方式:</strong> ${order.paymentMethod}</p>
                            <p><strong>收货地址:</strong> ${order.shippingAddress}</p>
                            <p><strong>联系电话:</strong> ${order.contactPhone}</p>
                            <p><strong>订单详情:</strong></p>
                            <ul>
                                ${order.orderDetails.map(detail => `<li>${detail.productName} (${detail.specification}) x ${detail.quantity} - ¥${detail.unitPrice.toFixed(2)}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                    orderList.appendChild(item);
                });
            })
            .catch(error => {
                orderList.innerHTML = '<li>加载订单失败。</li>';
                console.error('获取订单数据时发生错误:', error);
            });
    }
    document.addEventListener('DOMContentLoaded', function() {
        const orderList = document.getElementById('order-list');
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');

        // Fetch and display orders
        fetch('http://127.0.0.1:8081/orders/list')
            .then(response => {
                if (!response.ok) {
                    throw new Error('网络响应失败: ' + response.statusText);
                }
                return response.json();
            })
            .then(orders => {
                orderList.innerHTML = ''; // Clear loading state
                orders.forEach(order => {
                    const item = document.createElement('li');
                    item.className = 'order-item';
                    item.dataset.orderId = order.orderId;

                    const statusMap = {
                        0: '待付款',
                        1: '已付款',
                        2: '已发货',
                        3: '已完成',
                        4: '已取消'
                    };

                    item.innerHTML = `
                            <div class="order-summary">
                                <p><strong>订单ID:</strong> ${order.orderId}</p>
                                <p><strong>用户ID:</strong> ${order.userId}</p>
                                <p><strong>价格:</strong> ¥${order.totalAmount.toFixed(2)}</p>
                                <p><strong>状态:</strong> ${statusMap[order.orderStatus] || '未知'}</p>
                            </div>
                            <div class="order-details" style="display: none;">
                                <p><strong>下单时间:</strong> ${new Date(order.orderTime).toLocaleString()}</p>
                                <p><strong>支付方式:</strong> ${order.paymentMethod}</p>
                                <p><strong>收货地址:</strong> ${order.shippingAddress}</p>
                                <p><strong>联系电话:</strong> ${order.contactPhone}</p>
                                <p><strong>订单详情:</strong></p>
                                <ul>
                                    ${order.orderDetails.map(detail => `<li>${detail.productName} (${detail.specification}) x ${detail.quantity} - ¥${detail.unitPrice.toFixed(2)}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    orderList.appendChild(item);
                });
            })
            .catch(error => {
                orderList.innerHTML = '<li>加载订单失败。请检查您的后端服务是否正在运行，并确认已正确配置CORS跨域请求策略。</li>';
                console.error('获取订单数据时发生错误:', error);
            });

        // Toggle order details visibility and active state
        orderList.addEventListener('click', function(e) {
            const clickedItem = e.target.closest('.order-item');
            if (clickedItem) {
                // Remove active class from all items
                document.querySelectorAll('.order-item').forEach(el => {
                    if (el !== clickedItem) {
                        el.classList.remove('active');
                        const details = el.querySelector('.order-details');
                        if (details) details.style.display = 'none';
                    }
                });

                // Toggle active class on the clicked item
                clickedItem.classList.toggle('active');

                // Toggle display of details for the clicked item
                const details = clickedItem.querySelector('.order-details');
                if (details) {
                    details.style.display = clickedItem.classList.contains('active') ? 'block' : 'none';
                }
            }
        });

        // 解析智能客服返回的订单信息
        function parseOrderFromReply(agentReply) {
            try {
                // 提取订单ID
                const orderIdMatch = agentReply.match(/\*\*订单ID\*\*:\s*([A-Z0-9]+)/i);
                if (!orderIdMatch) return null;

                const orderId = orderIdMatch[1];
                
                // 提取用户ID
                const userIdMatch = agentReply.match(/\*\*用户ID\*\*:\s*([A-Z0-9]+)/i);
                const userId = userIdMatch ? userIdMatch[1] : '';

                // 提取总金额
                const totalAmountMatch = agentReply.match(/\*\*总金额\*\*:\s*([\d.]+)/i);
                const totalAmount = totalAmountMatch ? parseFloat(totalAmountMatch[1]) : 0;

                // 提取订单状态
                const statusMatch = agentReply.match(/\*\*订单状态\*\*:\s*[^（]*（状态码(\d+)/i);
                const orderStatus = statusMatch ? parseInt(statusMatch[1]) : 0;

                // 提取下单时间
                const orderTimeMatch = agentReply.match(/\*\*下单时间\*\*:\s*([\d\s:-]+)/i);
                const orderTime = orderTimeMatch ? orderTimeMatch[1] : new Date().toISOString();

                // 提取支付方式
                const paymentMethodMatch = agentReply.match(/\*\*支付方式\*\*:\s*([^\n-]+)/i);
                const paymentMethod = paymentMethodMatch ? paymentMethodMatch[1].trim() : '';

                // 提取收货地址
                const shippingAddressMatch = agentReply.match(/\*\*收货地址\*\*:\s*([^\n-]+)/i);
                const shippingAddress = shippingAddressMatch ? shippingAddressMatch[1].trim() : '';

                // 提取联系电话
                const contactPhoneMatch = agentReply.match(/\*\*联系电话\*\*:\s*([^\n-]+)/i);
                const contactPhone = contactPhoneMatch ? contactPhoneMatch[1].trim() : '';

                // 提取订单详情
                const orderDetails = [];
                const detailSection = agentReply.match(/\*\*订单详情\*\*:([\s\S]*?)(?:---|###|$)/i);
                if (detailSection) {
                    const detailText = detailSection[1];
                    
                    // 提取商品ID
                    const productIdMatch = detailText.match(/商品ID:\s*([A-Z0-9]+)/i);
                    const productId = productIdMatch ? productIdMatch[1] : '';
                    
                    // 提取商品名称
                    const productNameMatch = detailText.match(/商品名称:\s*([^\n-]+)/i);
                    const productName = productNameMatch ? productNameMatch[1].trim() : '';
                    
                    // 提取数量
                    const quantityMatch = detailText.match(/数量:\s*(\d+)/i);
                    const quantity = quantityMatch ? parseInt(quantityMatch[1]) : 1;
                    
                    // 提取单价
                    const unitPriceMatch = detailText.match(/单价:\s*([\d.]+)/i);
                    const unitPrice = unitPriceMatch ? parseFloat(unitPriceMatch[1]) : 0;
                    
                    // 提取总价
                    const totalPriceMatch = detailText.match(/总价:\s*([\d.]+)/i);
                    const totalPrice = totalPriceMatch ? parseFloat(totalPriceMatch[1]) : unitPrice;
                    
                    // 提取规格
                    const specificationMatch = detailText.match(/规格:\s*([^\n-]+)/i);
                    const specification = specificationMatch ? specificationMatch[1].trim() : '';

                    if (productId || productName) {
                        orderDetails.push({
                            productId: productId,
                            productName: productName,
                            quantity: quantity,
                            unitPrice: unitPrice,
                            totalPrice: totalPrice,
                            specification: specification
                        });
                    }
                }

                return {
                    orderId: orderId,
                    userId: userId,
                    orderTime: orderTime,
                    totalAmount: totalAmount,
                    orderStatus: orderStatus,
                    paymentMethod: paymentMethod,
                    shippingAddress: shippingAddress,
                    contactPhone: contactPhone,
                    orderDetails: orderDetails
                };
            } catch (error) {
                console.error('解析订单信息失败:', error);
                return null;
            }
        }

        // 创建订单列表项
        function createOrderItem(order) {
            const item = document.createElement('li');
            item.className = 'order-item';
            item.dataset.orderId = order.orderId;

            const statusMap = {
                0: { text: '待付款', icon: '⏳' },
                1: { text: '已付款', icon: '💰' },
                2: { text: '已发货', icon: '🚚' },
                3: { text: '已完成', icon: '✅' },
                4: { text: '已取消', icon: '❌' }
            };

            const status = statusMap[order.orderStatus] || { text: '未知', icon: '❓' };

            item.innerHTML = `
                <div class="order-summary">
                    <p><strong>订单ID:</strong> ${order.orderId}</p>
                    <p><strong>用户ID:</strong> ${order.userId}</p>
                    <p><strong>价格:</strong> ¥${order.totalAmount.toFixed(2)}</p>
                    <p><strong>状态:</strong> <span class="status-icon">${status.icon} </span> ${status.text}</p>
                </div>
                <div class="order-details" style="display: none;">
                    <p><strong>下单时间:</strong> ${order.orderTime}</p>
                    <p><strong>支付方式:</strong> ${order.paymentMethod || '未设置'}</p>
                    <p><strong>收货地址:</strong> ${order.shippingAddress || '未设置'}</p>
                    <p><strong>联系电话:</strong> ${order.contactPhone || '未设置'}</p>
                    <p><strong>订单详情:</strong></p>
                    <ul>
                        ${order.orderDetails.map(detail => 
                            `<li>${detail.productName} ${detail.specification ? '(' + detail.specification + ')' : ''} x ${detail.quantity} - ¥${detail.unitPrice.toFixed(2)}</li>`
                        ).join('')}
                    </ul>
                </div>
            `;

            return item;
        }

        // 替换订单列表（用新订单替换整个列表）
        function replaceOrderList(order) {
            const orderList = document.getElementById('order-list');
            
            // 清空现有列表
            orderList.innerHTML = '';
            
            // 添加新订单
            const item = createOrderItem(order);
            orderList.appendChild(item);
            
            // 高亮显示新订单
            item.classList.add('active');
            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => {
                item.classList.remove('active');
            }, 2000);
        }

        // Function to send a chat message
        function sendMessage() {
            const messageText = chatInput.value.trim();
            if (messageText) {
                // Display user's message
                const userMessageElement = document.createElement('div');
                userMessageElement.className = 'message my-message';
                userMessageElement.textContent = messageText;
                chatBox.appendChild(userMessageElement);
                chatInput.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                // Call agent API
                fetch(`http://127.0.0.1:8888/agent/chat?message=${encodeURIComponent(messageText)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('代理服务响应失败');
                        }
                        return response.text(); // Assuming plain text response
                    })
                    .then(agentReply => {
                        // 尝试解析订单信息
                        const orderInfo = parseOrderFromReply(agentReply);
                        if (orderInfo) {
                            // 如果解析到订单信息，替换左侧列表
                            replaceOrderList(orderInfo);
                        }

                        // Display agent's response in chat box
                        const agentMessageElement = document.createElement('div');
                        agentMessageElement.className = 'message other-message';
                        // 保持原始格式，支持换行
                        agentMessageElement.innerHTML = agentReply.replace(/\n/g, '<br>');
                        chatBox.appendChild(agentMessageElement);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    })
                    .catch(error => {
                        console.error('调用代理API时出错:', error);
                        const errorMessageElement = document.createElement('div');
                        errorMessageElement.className = 'message other-message';
                        errorMessageElement.style.color = 'red';
                        errorMessageElement.textContent = '无法连接到代理服务。';
                        chatBox.appendChild(errorMessageElement);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    });
            }
        }

        // Event listeners for sending a message
        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>

</body>
</html>
