name: ecommerce-order-agent-platform

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-portfolio-root}
      MYSQL_DATABASE: products
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfolio}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-29530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_HOST_PORT:-19091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESRV_HOST_PORT:-19876}:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -c /home/rocketmq/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx256m
    depends_on:
      - rocketmq-namesrv
    ports:
      - "127.0.0.1:20909:20909"
      - "127.0.0.1:20911:20911"
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-19200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  elasticsearch-data:
