# RAG 专用配置：Milvus 向量库 + 文档 catalog
# 由 application.yml 通过 spring.config.import 引入

spring:
  ai:
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:29530}
        collection-name: mall_rag_v3
        dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
        index-type: IVF_FLAT
        metric-type: COSINE
        # RagService owns the richer v3 schema; prevent the generic VectorStore schema racing it.
        initialize-schema: false

# catalog 使用 List（含 filename 字段），避免文件名中的 "." 导致配置绑定失败
rag:
  data-dir: data
  collection-name: ${RAG_COLLECTION_NAME:mall_rag_v3}
  dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
  chunk:
    strategy: CONTENT_TYPE_AWARE
    max-num-chunks: 10000
    fixed-size:
      max-tokens: 250
    sliding-window:
      max-tokens: 250
      overlap-tokens: 50
    recursive:
      min-tokens: 80
      max-tokens: 400
      overlap-tokens: 40
    semantic:
      min-tokens: 100
      target-tokens: 250
      max-tokens: 500
      batch-size: 64
      max-sentences: 2000
      boundary-percentile: 0.85
    parent-child:
      parent-tokens: 800
      child-tokens: 200
      child-overlap-tokens: 40
  rerank:
    enabled: true
    model: qwen3-rerank
    base-url: https://dashscope.aliyuncs.com/compatible-api/v1/reranks
    candidate-multiplier: 3
    min-score: 0.0
    instruct: "Given a web search query, retrieve relevant passages that answer the query."
  ask:
    model: qwen-plus
    temperature: 0.3
    context-top-k: 5
    prompt-version: v3
    system-prompt: |
      你是企业知识库与业务工具问答助手。请严格根据用户消息中的「工具查询结果」和「参考资料」回答问题。
      要求：
      1. 若提供了工具查询结果，将其作为订单状态等实时业务事实，不得忽略或否认其中已有字段。
      2. 规则、政策和制度依据仅使用参考资料中的信息，不要编造。
      3. 工具事实或参考资料不足时，只说明实际缺失的部分，不要把已提供的信息说成缺失。
      4. 回答简洁、准确，可使用条目列表。
      5. 不要透露参考资料的编号或内部字段名。
      6. 工具结果标记为“权威结论”时，不得使用知识库或模型推理修改、弱化或推翻该结论。
      7. 当前可见参考资料已经过服务端权限过滤；身份只用于调整表达方式，不得据此推断或索取权限外内容。

  catalog:
    - filename: 01_HR员工手册.pdf
      department: HR
      role: hr
      version: "3.2"
    - filename: 02_财务制度.pdf
      department: Finance
      role: finance
      version: "2.1"
    - filename: 03_电商订单规则.pdf
      department: Operations
      role: public
      version: "5.1"
    - filename: 04_物流规则.pdf
      department: Logistics
      role: public
      version: "3.0"
    - filename: 05_客服处理手册.pdf
      department: CustomerService
      role: customer_service
      version: "4.1"
    - filename: 06_技术开发规范.pdf
      department: Engineering
      role: developer
      version: "2.4"
    - filename: 07_AI_Agent运维手册.pdf
      department: Platform
      role: admin
      version: "1.3"
    - filename: 08_销售业务手册.pdf
      department: Sales
      role: sales
      version: "1.0"
