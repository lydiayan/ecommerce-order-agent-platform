server:
  port: 8086

spring:
  application:
    name: mall-order-milvus-rag

  ai:
    # Embedding 模型配置（DashScope OpenAI 兼容接口）
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      embedding:
        options:
          model: text-embedding-v2

    # Milvus 向量数据库配置
    vectorstore:
      milvus:
        host: localhost
        port: 19530
        collection-name: mall_rag_collection
        dimensions: 1536
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

